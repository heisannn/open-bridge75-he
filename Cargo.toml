[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/bridge75-core", "crates/bridge75-device", "crates/bridge75-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bridge75-core = { path = "crates/bridge75-core" }
bridge75-device = { path = "crates/bridge75-device" }

anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
dirs = "6"
gpui-kit = "0.8.1"
hidapi = "2.6"
# Same major version as gpui-component, so both share one current locale.
rust-i18n = "4.2"
serde = { version = "1", features = ["derive"] }
sys-locale = "0.3"
thiserror = "2"
toml = "1"

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

