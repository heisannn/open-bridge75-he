keymap.fixed:
  en: Fixed by the keyboard
  ja: キーボードで固定
keymap.fixed_key:
  en: The keyboard fixes what this key does while Fn is held, so it can't be changed.
  ja: このキーを Fn と一緒に押したときの動作はキーボードで固定されているため、変更できません。
keymap.no_selection:
  en: Select a key to change what it sends.
  ja: 送る内容を変更するキーを選択してください。
