monitor.title:
  en: Key travel
  ja: 押し込み量
monitor.description:
  en: When several keys move at the same moment, the keyboard reports only one of them.
  ja: 複数のキーが同時に動いたときは、キーボードがそのうち 1 つだけを報告します。
monitor.not_connected:
  en: Connect the keyboard to see key travel.
  ja: 押し込み量を表示するには、キーボードを接続してください。
monitor.start_failed:
  en: Couldn't start showing key travel. Open this page again to retry.
  ja: 押し込み量の表示を開始できませんでした。このページを開き直すと、もう一度試します。

