overview.title:
  en: Keyboard
  ja: キーボード
overview.searching:
  en: Connect the Bridge75 HE with a USB cable.
  ja: Bridge75 HE を USB ケーブルで接続してください。
overview.bootloader:
  en: The keyboard is in firmware update mode. Unplug the USB cable and plug it back in.
  ja: キーボードがファームウェア更新モードになっています。USB ケーブルを抜いて、もう一度挿してください。
overview.unavailable:
  en: A keyboard was found, but it couldn't be opened. The app keeps trying.
  ja: キーボードは見つかりましたが、開けませんでした。引き続き接続を試みます。
overview.rejected:
  en: A device was found, but it didn't identify itself as a Bridge75 HE, so the app leaves it alone. To try again, unplug the USB cable and plug it back in.
  ja: デバイスは見つかりましたが、Bridge75 HE として確認できなかったため、操作していません。もう一度試すには、USB ケーブルを抜いて挿し直してください。
overview.stopped:
  en: The connection to the keyboard stopped unexpectedly. Restart the app to connect again.
  ja: キーボードとの接続処理が予期せず停止しました。もう一度接続するには、アプリを再起動してください。
