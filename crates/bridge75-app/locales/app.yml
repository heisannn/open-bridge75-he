keymap.title:
  en: Keymap
  ja: キーマップ
keymap.not_written:
  en: This app hasn't written a keymap to this keyboard yet, so the default keymap is shown. Changing a key writes the whole keymap and replaces assignments made with other apps.
  ja: このアプリはまだこのキーボードにキーマップを書き込んでいないため、既定のキーマップを表示しています。キーを変更するとキーマップ全体を書き込むので、ほかのアプリで設定した割り当ては置き換わります。
