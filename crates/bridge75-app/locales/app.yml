  ja: "%{key} と同時に送ります。2 つまで選べます。"
keymap.write_failed:
  en: Couldn't write the keymap. The keyboard may not have the assignments shown. Check the USB cable and write it again.
  ja: キーマップを書き込めませんでした。表示中の割り当てがキーボードに反映されていない可能性があります。USB ケーブルを確認して、もう一度書き込んでください。
keymap.write_again:
  en: Write again
  ja: もう一度書き込む
keymap.save_failed:
  en: The keyboard has the keymap, but it couldn't be saved on this computer. Next time, the app may show an older keymap.
  ja: キーマップはキーボードに書き込みましたが、このコンピューターに保存できませんでした。次回は古いキーマップが表示される場合があります。
keymap.no_fn_key:
  en: No key on the base layer is Fn, so the Fn layer can't be used.
  ja: 通常レイヤーに Fn キーがないため、Fn レイヤーを使えません。
