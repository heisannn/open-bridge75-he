error.load_failed:
  en: Couldn't read from the keyboard
  ja: キーボードから読み込めませんでした
error.load_failed.body:
  en: Check the USB cable, then choose Try again on the Trigger page.
  ja: USB ケーブルを確認してから、「トリガー」ページの「再試行」を選んでください。
error.write_failed:
  en: Couldn't change the keyboard setting
  ja: キーボードの設定を変更できませんでした
error.write_failed.body:
  en: The page now shows the settings the keyboard has. Check the USB cable and try again.
  ja: ページには、キーボードに現在保存されている設定を表示しています。USB ケーブルを確認して、もう一度お試しください。
